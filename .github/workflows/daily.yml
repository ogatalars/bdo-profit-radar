name: snapshot diario do mercado

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O snapshot de ontem e o unico estado do projeto e serve so para o diff
      # de hoje. Fica no cache para nao inchar o git em ~1 MB por dia.
      # Se o cache evaporar, o build volta a "primeiro snapshot" e perde um dia
      # de variacao, nada alem disso.
      - name: restaurar snapshot anterior
        uses: actions/cache@v4
        with:
          path: data/snapshot.*.json
          key: market-snapshot-${{ github.run_id }}
          restore-keys: market-snapshot-

      - name: gerar snapshots
        run: |
          failed=""
          for region in na eu sa; do
            echo "::group::$region"
            # Uma regiao que falha nao derruba as outras: o site continua
            # servindo o snapshot de ontem para ela.
            REGION=$region node scripts/build-daily.js || failed="$failed $region"
            echo "::endgroup::"
          done
          [ -n "$failed" ] && echo "::warning::regioes sem atualizacao hoje:$failed"
          exit 0

      - name: validar os dados gerados
        run: node scripts/test.js

      - name: commitar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "nada mudou" && exit 0
          git commit -m "chore: snapshot do mercado $(date -u +%Y-%m-%d)"
          git push
