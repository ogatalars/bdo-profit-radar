<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDO Profit Radar</title>
<meta name="description" content="Itens em alta, receitas lucrativas, melhores spots de grind e guia de classes de Black Desert Online.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128176;</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="topbar">
    <h1>BDO <span>Profit Radar</span></h1>
    <select id="lang" aria-label="idioma / language">
      <option value="pt">Português</option>
      <option value="en">English</option>
    </select>
  </div>
  <p class="sub" id="status"></p>
</header>
<main>
  <nav role="tablist">
    <button role="tab" data-tab="market" aria-selected="true" data-i18n="tabMarket"></button>
    <button role="tab" data-tab="recipes" aria-selected="false" data-i18n="tabRecipes"></button>
    <button role="tab" data-tab="calc" aria-selected="false" data-i18n="tabCalc"></button>
    <button role="tab" data-tab="spots" aria-selected="false" data-i18n="tabSpots"></button>
    <button role="tab" data-tab="xp" aria-selected="false" data-i18n="tabXp"></button>
    <button role="tab" data-tab="classes" aria-selected="false" data-i18n="tabClasses"></button>
  </nav>

  <div class="controls">
    <label class="inline"><input type="checkbox" id="vp" checked> <span data-i18n="valuePack"></span></label>
    <label class="inline"><input type="checkbox" id="ring" checked> <span data-i18n="ring"></span></label>
    <label><span data-i18n="region"></span>
      <select id="region"><option value="na">NA</option><option value="eu">EU</option>
      <option value="sa">SA</option></select>
    </label>
    <span class="dim" style="font-size:12px" id="netpct"></span>
  </div>

  <section id="tab-market">
    <div class="note" data-i18n="marketNote"></div>
    <div class="grid2">
      <div><h3 data-i18n="demandTitle"></h3><table id="t-demand"><thead><tr>
        <th data-i18n="item"></th><th class="num" data-i18n="price"></th>
        <th class="num" data-i18n="sold24"></th><th class="num" data-i18n="turnover"></th>
      </tr></thead><tbody></tbody></table></div>
      <div><h3 data-i18n="moversTitle"></h3><table id="t-movers"><thead><tr>
        <th data-i18n="item"></th><th class="num" data-i18n="price"></th>
        <th class="num" data-i18n="change"></th><th class="num" data-i18n="stock"></th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section id="tab-recipes" hidden>
    <div class="note" data-i18n="recipesNote"></div>
    <div class="controls">
      <label><span data-i18n="search"></span><input type="search" id="recSearch"></label>
      <label><span data-i18n="job"></span><select id="recJob">
        <option value="" data-i18n="all"></option>
        <option value="cooking" data-i18n="cooking"></option>
        <option value="alchemy" data-i18n="alchemy"></option>
        <option value="processing" data-i18n="processing"></option></select></label>
      <label><span data-i18n="sortBy"></span><select id="recSort">
        <option value="profit" data-i18n="sortProfit"></option>
        <option value="name" data-i18n="sortName"></option></select></label>
    </div>
    <div id="recipe-list"></div>
  </section>

  <section id="tab-calc" hidden>
    <div class="note" data-i18n="calcNote"></div>
    <div class="controls">
      <label><span data-i18n="whatToMake"></span>
        <input list="all-outputs" id="calcItem" autocomplete="off" style="min-width:230px"></label>
      <datalist id="all-outputs"></datalist>
      <label><span data-i18n="howMany"></span>
        <input type="number" id="calcQty" value="100" min="1" max="100000" step="1"></label>
      <label class="inline"><input type="checkbox" id="calcExpand"> <span data-i18n="expandAll"></span></label>
    </div>
    <div id="calc-out"></div>
  </section>

  <section id="tab-spots" hidden>
    <div class="controls">
      <label><span data-i18n="class"></span><select id="cls"></select></label>
      <label><span data-i18n="totalStat"></span><input type="number" id="stat" value="1130" min="0" max="3000" step="10"></label>
      <label><span data-i18n="totalStatDp"></span><input type="number" id="dpStat" value="430" min="0" max="1000" step="10"></label>
      <label class="inline"><input type="checkbox" id="hideLocked"> <span data-i18n="onlyMine"></span></label>
    </div>
    <div class="note" data-i18n="spotsNote"></div>
    <div id="spot-list"></div>
  </section>

  <section id="tab-xp" hidden>
    <div class="note" data-i18n="xpNote"></div>
    <div class="controls">
      <label><span data-i18n="totalStat"></span><input type="number" id="xpStat" value="1130" min="0" max="3000" step="10"></label>
      <label><span data-i18n="totalStatDp"></span><input type="number" id="xpDp" value="430" min="0" max="1000" step="10"></label>
      <label class="inline"><input type="checkbox" id="xpHideLocked"> <span data-i18n="onlyMine"></span></label>
    </div>
    <div id="xp-list"></div>
  </section>

  <section id="tab-classes" hidden>
    <div class="note" id="classesNote"></div>
    <div class="controls">
      <label><span data-i18n="search"></span><input type="search" id="clsSearch"></label>
      <label><span data-i18n="tier"></span><select id="clsTier">
        <option value="" data-i18n="all"></option><option>S</option><option>A+</option>
        <option>A</option><option>B</option><option>C</option></select></label>
      <label><span data-i18n="aoe"></span><select id="clsAoe">
        <option value="" data-i18n="all"></option>
        <option value="enorme" data-i18n="aoe_enorme"></option>
        <option value="medio" data-i18n="aoe_medio"></option>
        <option value="pequeno" data-i18n="aoe_pequeno"></option></select></label>
      <label><span data-i18n="tankiness"></span><select id="clsTank">
        <option value="" data-i18n="all"></option>
        <option value="muito-resistente" data-i18n="tank_muito-resistente"></option>
        <option value="resistente" data-i18n="tank_resistente"></option>
        <option value="fragil" data-i18n="tank_fragil"></option></select></label>
    </div>
    <div id="class-list"></div>
  </section>
</main>
<footer data-i18n="footerSources"></footer>
<script type="module" src="app.js"></script>
</body>
</html>
